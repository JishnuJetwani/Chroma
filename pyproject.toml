[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-photograder"
version = "0.1.0"
description = "Local photo grading with learned color LUTs and selective tonal correction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8,<2.9",
  "numpy>=1.26,<3",
  "Pillow>=11.2,<12",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
app = ["gradio>=6,<7"]
data = ["pypng>=0.20220715.0"]
raw = ["rawpy>=0.27,<0.28", "tifffile>=2025.1", "imagecodecs>=2025.1"]
dev = ["pytest>=8,<9", "ruff>=0.12"]
cloud = [
    "modal>=1,<2",
]

[project.scripts]
photograder = "photograder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mps: requires Apple Metal", "slow: longer integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
