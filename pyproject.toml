[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "selective-photograder"
version = "0.1.0"
description = "Local photo grading with learned color lookup tables"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.8,<2.9",
  "numpy>=1.26,<3",
  "Pillow>=11.2,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12"]

[project.scripts]
photograder = "photograder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["mps: requires Apple Metal", "slow: longer integration tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
